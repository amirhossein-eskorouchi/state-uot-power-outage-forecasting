name: Static repository checks

on:
  push:
  pull_request:

jobs:
  syntax-and-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check Python syntax (no model training)
        run: python -m py_compile FINAL_TRIAL22_END_TO_END.py
      - name: Confirm public project artifacts
        run: |
          test -f 'docs/presentation/0Final Presentation (Data Chalenge).pdf'
          test -f assets/figures/architecture.png
          test -f assets/figures/severity-concentration.png
          test -f assets/figures/validation-design.png
          test -f assets/figures/holdout-forecasts.png
          test -f assets/figures/county-trajectories.png
          test -f docs/REPRODUCIBILITY.md
